<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Amulet 地图编辑器文档 / Amulet Map Editor Docs</title>
<meta name="description" content="Amulet 地图编辑器多语言文档（简体中文 / English）">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f3f6f9;
    color: #1f2933;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .wrap { text-align: center; padding: 48px 24px; max-width: 720px; }
  .logo { width: 84px; height: 84px; border-radius: 20px; margin-bottom: 20px; }
  h1 { font-size: 26px; margin-bottom: 8px; }
  p.sub { color: #52606d; font-size: 15px; margin-bottom: 36px; }
  .cards { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; }
  a.card {
    display: block;
    width: 240px;
    padding: 26px 20px;
    background: #fff;
    border: 1px solid #e4e9f0;
    border-radius: 14px;
    text-decoration: none;
    color: inherit;
    transition: all .18s ease;
    box-shadow: 0 1px 3px rgba(16,24,40,.06);
  }
  a.card:hover { transform: translateY(-3px); border-color: #b3c6de; box-shadow: 0 8px 20px rgba(16,24,40,.10); }
  .flag { font-size: 30px; display: block; margin-bottom: 10px; }
  .lang { font-size: 18px; font-weight: 600; display: block; margin-bottom: 4px; }
  .desc { font-size: 13px; color: #7b8794; }
  footer { margin-top: 40px; font-size: 13px; color: #9aa5b1; }
  footer a { color: #4a6fa5; text-decoration: none; }
  footer a:hover { text-decoration: underline; }
</style>
</head>
<body>
  <div class="wrap">
    <img class="logo" src="zh_CN/_static/images/start_screen.png" alt="Amulet Map Editor" onerror="this.style.display='none'">
    <h1>Amulet 地图编辑器文档</h1>
    <p class="sub">Amulet Map Editor Documentation &middot; v0.10.62 &middot; 选择语言 / Choose your language</p>
    <div class="cards">
      <a class="card" href="zh_CN/" lang="zh-CN">
        <span class="flag">🇨🇳</span>
        <span class="lang">简体中文</span>
        <span class="desc">Simplified Chinese</span>
      </a>
      <a class="card" href="en/" lang="en">
        <span class="flag">🇬🇧</span>
        <span class="lang">English</span>
        <span class="desc">英文原版</span>
      </a>
    </div>
    <footer>
      <a href="https://github.com/YHXJLB/Amulet-Map-Editor/releases/latest">下载最新版本 / Download</a>
      &middot;
      <a href="https://github.com/YHXJLB/Amulet-Map-Editor">GitHub</a>
    </footer>
  </div>
  <script>
    // 首次访问时按浏览器语言自动跳转（通过 # 手动停留在选择页）
    (function () {
      if (location.hash === "#choose" || location.search.indexOf("lang=") !== -1) return;
      try {
        var langs = navigator.languages && navigator.languages.length
          ? navigator.languages : [navigator.language || "en"];
        for (var i = 0; i < langs.length; i++) {
          var l = langs[i].toLowerCase();
          if (l.indexOf("zh") === 0) { location.replace("zh_CN/"); return; }
          if (l.indexOf("en") === 0) { location.replace("en/"); return; }
        }
      } catch (e) { /* stay on chooser */ }
    })();
  </script>
</body>
</html>
