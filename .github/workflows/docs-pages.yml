name: Docs Pages

on:
  push:
    branches: [documentation]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Sphinx dependencies
        run: |
          pip install "Sphinx>=7.0" sphinx_rtd_theme

      - name: Build Chinese documentation
        run: |
          sphinx-build -b html docs docs/_build/site/zh_CN

      - name: Build English documentation
        run: |
          sphinx-build -b html docs_en docs/_build/site/en

      - name: Assemble site root (language chooser + CNAME + .nojekyll)
        run: |
          cp pages-root/index.html docs/_build/site/index.html
          cp CNAME docs/_build/site/CNAME
          touch docs/_build/site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
