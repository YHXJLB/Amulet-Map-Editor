name: Build Windows

on:
  release:
    types: [published]
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  deploy:
    strategy:
      fail-fast: false
      matrix:
        cfg:
          - { os: windows-2025, python-version: '3.11', architecture: x64 }
          - { os: windows-11-arm, python-version: '3.11', architecture: arm64 }

    runs-on: ${{ matrix.cfg.os }}
    defaults:
      run:
        shell: bash

    steps:
    - name: Clone
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Set up Python ${{ matrix.cfg.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.cfg.python-version }}
        architecture: ${{ matrix.cfg.architecture }}

    - name: Setup MSVC
      if: matrix.cfg.os == 'windows-11-arm'
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: arm64

    - name: Compute version & release target
      # 版本号以 git tag 为准（去掉前缀 v）。无 tag 的开发构建用 run_number 兜底。
      run: |
        if [ "${{ github.event_name }}" = "release" ]; then
          RAW="${{ github.event.release.tag_name }}"
        elif [ "${{ github.ref_type }}" = "tag" ]; then
          RAW="${GITHUB_REF_NAME}"
        else
          echo "BUILD_VERSION=0.10.${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=ci-${{ github.run_id }}-${{ matrix.cfg.architecture }}" >> "$GITHUB_ENV"
          echo "IS_RELEASE=false" >> "$GITHUB_ENV"
          exit 0
        fi
        echo "BUILD_VERSION=${RAW#v}" >> "$GITHUB_ENV"
        echo "RELEASE_TAG=${RAW}" >> "$GITHUB_ENV"
        echo "IS_RELEASE=true" >> "$GITHUB_ENV"

    - name: Install dependencies
      run: |
        pip install twine pyinstaller~=6.18 build

    - name: Build Wheels
      shell: pwsh
      run: |
        $env:BDISTWHEELFREEZELIBS = "true"
        python -m build

    - name: Install Wheels
      run: |
        python -m pip install dist/amulet_map_editor-*.whl --upgrade

    - name: PyInstaller build
      run: |
        python -m PyInstaller -y --distpath ./installer/dist installer/Amulet.spec

    - name: Windows - Install NSIS (portable)
      # 直接下载 NSIS 便携版并显式记录 makensis 路径，避免 install-nsis action 在 windows-2025 上未加入 PATH 的问题。
      shell: pwsh
      run: |
        $ProgressPreference = 'SilentlyContinue'
        Invoke-WebRequest -Uri "https://sourceforge.net/projects/nsis/files/NSIS%203/3.11/nsis-3.11.zip/download" -OutFile nsis.zip
        Expand-Archive -Path nsis.zip -DestinationPath nsis_extract -Force
        $nsis = (Get-ChildItem nsis_extract -Recurse -Filter makensis.exe | Select-Object -First 1).FullName
        echo "NSIS_BIN=$nsis" >> "$env:GITHUB_ENV"
        Remove-Item nsis.zip, nsis_extract -Recurse -Force

    - name: Windows - Build NSIS installer
      # 安装版 exe：makensis 从 installer/ 目录执行，输入 dist/amulet/，输出 dist/Amulet-<version>-Windows-<arch>.exe
      shell: pwsh
      run: |
        cd installer
        & "$env:NSIS_BIN" /DVERSION="${{ env.BUILD_VERSION }}" /DARCH="${{ matrix.cfg.architecture }}" windows.nsi
        cd ..
        Move-Item "installer/dist/Amulet-${{ env.BUILD_VERSION }}-Windows-${{ matrix.cfg.architecture }}.exe" "installer/dist/Amulet-v${{ env.BUILD_VERSION }}-Windows-${{ matrix.cfg.architecture }}-installer.exe"

    - name: Package portable build (zip)
      # 免安装版 zip：zip 根目录为 Amulet/ 文件夹，与 0.10.44 外层结构一致。
      # PyInstaller 6.x 的 contents_directory="lib" 会把依赖放到 Amulet/lib/ 下，
      # 这与 0.10.44 的扁平结构不同，要完全一致需改 spec 或降 PyInstaller 版本。
      shell: pwsh
      run: |
        cd installer/dist
        Move-Item amulet Amulet
        Compress-Archive -Path 'Amulet' -DestinationPath "Amulet-v${{ env.BUILD_VERSION }}-Windows-${{ matrix.cfg.architecture }}.zip" -Force
        cd ../..

    - name: Publish to PyPi
      env:
        TWINE_USERNAME: ${{ secrets.PYPI_USERNAME }}
        TWINE_PASSWORD: ${{ secrets.AMULET_MAP_EDITOR_PYPI_PASSWORD }}
      run: |
        if [ -n "$TWINE_PASSWORD" ]; then
          twine upload dist/amulet[_-]map[_-]editor*.tar.gz --skip-existing
        else
          echo "PyPI secrets not configured. Skipping publish."
        fi

    - name: Upload Release Asset
      uses: actions/upload-artifact@v6
      with:
        name: Amulet-v$BUILD_VERSION-${{ runner.os }}-${{ matrix.cfg.architecture }}
        path: |
          installer/dist/Amulet-*.zip
          installer/dist/Amulet-*.exe

    - name: Publish to GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ env.RELEASE_TAG }}
        name: Amulet ${{ env.BUILD_VERSION }}
        prerelease: ${{ env.IS_RELEASE == 'false' }}
        files: |
          installer/dist/Amulet-*.zip
          installer/dist/Amulet-*.exe
