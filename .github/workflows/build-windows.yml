name: Build Windows

on:
  release:
    types: [published]
  workflow_dispatch:
  push:
    branches:
      - 0.10

permissions:
  contents: write

jobs:
  deploy:
    strategy:
      fail-fast: false
      matrix:
        cfg:
          - { os: windows-2025, python-version: '3.11', architecture: x64 }
          - { os: windows-11-arm, python-version: '3.11', architecture: arm64 }

    runs-on: ${{ matrix.cfg.os }}
    defaults:
      run:
        shell: bash

    env:
      BUILD_VERSION: ${{ github.event.release.tag_name || format('0.10.{0}', github.run_number) }}

    steps:
    - name: Clone
      uses: actions/checkout@v6

    - name: Set up Python ${{ matrix.cfg.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.cfg.python-version }}
        architecture: ${{ matrix.cfg.architecture }}

    - name: Setup MSVC
      if: matrix.cfg.os == 'windows-11-arm'
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: arm64

    - name: Install dependencies
      run: |
        pip install twine pyinstaller~=6.18 build

    - name: Build Wheels
      shell: pwsh
      run: |
        $env:BDISTWHEELFREEZELIBS = "true"
        python -m build
        
    - name: Install Wheels
      run: |
        python -m pip install dist/amulet_map_editor-*.whl --upgrade

    - name: PyInstaller build
      run: |
        python -m PyInstaller -y --distpath ./installer/dist installer/Amulet.spec

    - name: Windows - Install NSIS
      uses: repolevedavaj/install-nsis@v1.2.0
      with:
        nsis-version: '3.11'

    - name: Windows - Sign and Create Installer
      env:
        KEY_VAULT_URL: ${{ secrets.KEY_VAULT_URL }}
        KEY_VAULT_CERTIFICATE: ${{ secrets.KEY_VAULT_CERTIFICATE }}
        KEY_VAULT_CLIENT_ID: ${{ secrets.KEY_VAULT_CLIENT_ID }}
        KEY_VAULT_SECRET: ${{ secrets.KEY_VAULT_SECRET }}
        KEY_VAULT_TENANT: ${{ secrets.KEY_VAULT_TENANT }}
      run: |
        curl -L -o azuresigntool.exe https://github.com/vcsjones/AzureSignTool/releases/download/v7.0.1/AzureSignTool-${{ matrix.cfg.architecture }}.exe
        if [ -n "$KEY_VAULT_URL" ]; then
          find ./installer/dist/amulet -type f \( -name "*.exe" -o -name "*.dll" -o -name "*.pyd" \) -exec ./azuresigntool.exe sign -kvu "$KEY_VAULT_URL" -kvc "$KEY_VAULT_CERTIFICATE" -kvi "$KEY_VAULT_CLIENT_ID" -kvs "$KEY_VAULT_SECRET" -kvt "$KEY_VAULT_TENANT" -tr http://timestamp.digicert.com -v "{}" \;
        else
          echo "No signing secrets configured. Skipping code signing."
        fi
        makensis -DVERSION=$BUILD_VERSION -DARCH=${{ matrix.cfg.architecture }} installer/windows.nsi
        if [ -n "$KEY_VAULT_URL" ]; then
          ./azuresigntool.exe sign -kvu "$KEY_VAULT_URL" -kvc "$KEY_VAULT_CERTIFICATE" -kvi "$KEY_VAULT_CLIENT_ID" -kvs "$KEY_VAULT_SECRET" -kvt "$KEY_VAULT_TENANT" -tr http://timestamp.digicert.com -v "./installer/dist/Amulet-$BUILD_VERSION-Windows-${{ matrix.cfg.architecture }}.exe"
        fi
        # 收拢安装器到 installer/dist（NSIS 的 OutFile 在不同环境可能落在仓库根 dist/ 或 installer/dist/）
        mkdir -p installer/dist
        cp -f "dist/Amulet-$BUILD_VERSION-Windows-${{ matrix.cfg.architecture }}.exe" "installer/dist/" 2>/dev/null || true
        cp -f "installer/dist/Amulet-$BUILD_VERSION-Windows-${{ matrix.cfg.architecture }}.exe" "installer/dist/" 2>/dev/null || true
        # 清理 PyInstaller 临时目录（安装器已内联这些文件），保留安装器 exe
        rm -rf installer/dist/amulet

    - name: Publish to PyPi
      env:
        TWINE_USERNAME: ${{ secrets.PYPI_USERNAME }}
        TWINE_PASSWORD: ${{ secrets.AMULET_MAP_EDITOR_PYPI_PASSWORD }}
      run: |
        if [ -n "$TWINE_PASSWORD" ]; then
          twine upload dist/amulet[_-]map[_-]editor*.tar.gz --skip-existing
        else
          echo "PyPI secrets not configured. Skipping publish."
        fi

    - name: Upload Release Asset
      uses: actions/upload-artifact@v6
      with:
        name: Amulet-$BUILD_VERSION-${{ runner.os }}-${{ matrix.cfg.architecture }}
        path: ./installer/dist

    - name: Publish to GitHub Release
      if: github.event_name != 'release'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ci-${{ github.run_id }}-${{ matrix.cfg.architecture }}
        name: CI Build 0.10.${{ github.run_number }} (${{ matrix.cfg.architecture }})
        prerelease: true
        files: installer/dist/Amulet-*.exe
