name: Build Windows

on:
  release:
    types: [published]
  workflow_dispatch:
  push:
    branches:
      - 0.10
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  deploy:
    strategy:
      fail-fast: false
      matrix:
        cfg:
          - { os: windows-2025, python-version: '3.11', architecture: x64 }
          - { os: windows-11-arm, python-version: '3.11', architecture: arm64 }

    runs-on: ${{ matrix.cfg.os }}
    defaults:
      run:
        shell: bash

    steps:
    - name: Clone
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Set up Python ${{ matrix.cfg.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.cfg.python-version }}
        architecture: ${{ matrix.cfg.architecture }}

    - name: Setup MSVC
      if: matrix.cfg.os == 'windows-11-arm'
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: arm64

    - name: Compute version & release target
      # 版本号以 git tag 为准（去掉前缀 v）。无 tag 的开发构建用 run_number 兜底。
      run: |
        if [ "${{ github.event_name }}" = "release" ]; then
          RAW="${{ github.event.release.tag_name }}"
        elif [ "${{ github.ref_type }}" = "tag" ]; then
          RAW="${GITHUB_REF_NAME}"
        else
          echo "BUILD_VERSION=0.10.${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=ci-${{ github.run_id }}-${{ matrix.cfg.architecture }}" >> "$GITHUB_ENV"
          echo "IS_RELEASE=false" >> "$GITHUB_ENV"
          exit 0
        fi
        echo "BUILD_VERSION=${RAW#v}" >> "$GITHUB_ENV"
        echo "RELEASE_TAG=${RAW}" >> "$GITHUB_ENV"
        echo "IS_RELEASE=true" >> "$GITHUB_ENV"

    - name: Install dependencies
      run: |
        pip install twine pyinstaller~=6.18 build

    - name: Build Wheels
      shell: pwsh
      run: |
        $env:BDISTWHEELFREEZELIBS = "true"
        python -m build

    - name: Install Wheels
      run: |
        python -m pip install dist/amulet_map_editor-*.whl --upgrade

    - name: PyInstaller build
      run: |
        python -m PyInstaller -y --distpath ./installer/dist installer/Amulet.spec

    - name: Package portable build (zip)
      # 与官方 0.10.44 产物结构一致：PyInstaller 单文件夹包 -> 压缩为 Amulet-v<版本>-Windows-<arch>.zip
      run: |
        cd installer/dist
        powershell -Command "Compress-Archive -Path 'amulet\*' -DestinationPath 'Amulet-v$BUILD_VERSION-Windows-${{ matrix.cfg.architecture }}.zip' -Force"
        cd ../..

    - name: Publish to PyPi
      env:
        TWINE_USERNAME: ${{ secrets.PYPI_USERNAME }}
        TWINE_PASSWORD: ${{ secrets.AMULET_MAP_EDITOR_PYPI_PASSWORD }}
      run: |
        if [ -n "$TWINE_PASSWORD" ]; then
          twine upload dist/amulet[_-]map[_-]editor*.tar.gz --skip-existing
        else
          echo "PyPI secrets not configured. Skipping publish."
        fi

    - name: Upload Release Asset
      uses: actions/upload-artifact@v6
      with:
        name: Amulet-v$BUILD_VERSION-${{ runner.os }}-${{ matrix.cfg.architecture }}
        path: installer/dist/Amulet-*.zip

    - name: Publish to GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ env.RELEASE_TAG }}
        name: Amulet ${{ env.BUILD_VERSION }} (${{ matrix.cfg.architecture }})
        prerelease: ${{ env.IS_RELEASE == 'false' }}
        files: installer/dist/Amulet-*.zip
