name: Build Docker

on:
  release:
    types: [published]
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Compute version & release target
      run: |
        if [ "${{ github.event_name }}" = "release" ]; then
          echo "RELEASE_TAG=${{ github.event.release.tag_name }}" >> "$GITHUB_ENV"
          echo "IS_RELEASE=true" >> "$GITHUB_ENV"
        elif [ "${{ github.ref_type }}" = "tag" ]; then
          echo "RELEASE_TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          echo "IS_RELEASE=true" >> "$GITHUB_ENV"
        else
          echo "RELEASE_TAG=ci-${{ github.run_id }}" >> "$GITHUB_ENV"
          echo "IS_RELEASE=false" >> "$GITHUB_ENV"
        fi

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set image name (lowercase owner)
      run: |
        echo "IMAGE=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/amulet-editor" >> "$GITHUB_ENV"

    - name: Build Docker image
      run: |
        docker build \
          . \
          --file Dockerfile \
          --tag amulet-editor:latest \
          --tag $IMAGE:${{ env.RELEASE_TAG }} \
          --tag $IMAGE:latest \
          --build-arg AMULET_VERSION=CUSTOM:git+https://github.com/${{ github.repository }}.git@${{ env.RELEASE_TAG }}

    - name: Push Docker image to GHCR
      run: |
        docker push $IMAGE:${{ env.RELEASE_TAG }}
        docker push $IMAGE:latest

    - name: Save and compress Docker image
      run: |
        docker save amulet-editor:latest | xz -9e > Amulet-${{ env.RELEASE_TAG }}-docker.tar.gz

    - name: Upload Release Asset
      uses: actions/upload-artifact@v6
      with:
        name: Amulet-${{ env.RELEASE_TAG }}-docker.tar.gz
        path: Amulet-${{ env.RELEASE_TAG }}-docker.tar.gz

    - name: Publish to GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ env.RELEASE_TAG }}
        name: Amulet ${{ env.RELEASE_TAG }}
        prerelease: ${{ env.IS_RELEASE == 'false' }}
        files: Amulet-${{ env.RELEASE_TAG }}-docker.tar.gz
