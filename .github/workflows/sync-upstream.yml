name: Sync Upstream & Build

# 自动把上游 Amulet-Team/Amulet-Map-Editor 的 0.10 分支合并进本 fork，
# 并在检测到上游发布新版本（如 0.10.64）时，用该版本号触发本 fork 原有的
# 4 个构建工作流（build-windows / build-debian / build-flatpak / build-docker）。
# 4 个构建工作流各自通过 softprops/action-gh-release 把产物上传到同名 release，
# overwrite:true 会把 4 份产物聚合到同一个 “Amulet <version>” release 下。

on:
  schedule:
    # 每天 UTC 03:23 检查一次上游
    - cron: '23 3 * * *'
  workflow_dispatch:
    inputs:
      force_build:
        description: '即使 fork 已发布该版本，也强制重新构建一次'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.detect.outputs.version }}
      do_build: ${{ steps.detect.outputs.do_build }}
    steps:
      - name: Checkout fork 0.10
        uses: actions/checkout@v6
        with:
          ref: '0.10'
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote & fetch
        run: |
          git remote add upstream https://github.com/Amulet-Team/Amulet-Map-Editor.git
          git fetch upstream 0.10 --no-tags

      - name: Merge upstream/0.10 (keep fork changes on conflict)
        id: merge
        run: |
          BEFORE=$(git rev-parse HEAD)
          # -X ours：冲突时保留本 fork 的改动（你领先的 36+ 个提交、改造过的构建工作流等），
          # 上游的非冲突改动照常合入。
          git merge upstream/0.10 --no-edit -X ours || { echo "::error::合并失败"; exit 1; }
          AFTER=$(git rev-parse HEAD)
          if [ "$BEFORE" != "$AFTER" ]; then
            echo "updated=true" >> "$GITHUB_OUTPUT"
          else
            echo "updated=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Push to fork 0.10
        if: steps.merge.outputs.updated == 'true'
        run: git push origin HEAD:refs/heads/0.10

      - name: Detect upstream latest release version
        id: detect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/Amulet-Team/Amulet-Map-Editor/releases/latest \
            | python -c 'import sys,json; print(json.load(sys.stdin).get("tag_name",""))')
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          if [ -z "$VER" ]; then
            echo "do_build=false" >> "$GITHUB_OUTPUT"
            echo "未获取到上游版本号，跳过构建"
            exit 0
          fi
          CODE=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/$VER")
          if [ "$CODE" = "200" ]; then
            echo "do_build=false" >> "$GITHUB_OUTPUT"
            echo "fork 已发布 $VER，跳过构建"
          else
            echo "do_build=true" >> "$GITHUB_OUTPUT"
            echo "上游新版本 $VER，将触发构建"
          fi

  build:
    needs: sync
    if: needs.sync.outputs.do_build == 'true' || github.event.inputs.force_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork 0.10
        uses: actions/checkout@v6
        with:
          ref: '0.10'
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Push version tag (给 Docker 构建一个合法的 git ref)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="${{ needs.sync.outputs.version }}"
          git tag -f "$VER" HEAD
          git push -f origin "refs/tags/$VER"

      - name: Trigger 4 build workflows with version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="${{ needs.sync.outputs.version }}"
          for wf in build-windows build-debian build-flatpak build-docker; do
            echo "dispatch $wf @ $VER"
            curl -s -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -d "{\"ref\":\"0.10\",\"inputs\":{\"version\":\"$VER\"}}" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/$wf.yml/dispatches"
          done
